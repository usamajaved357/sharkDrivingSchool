# Cloudflare Worker for the Shark Driving School API.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "shark-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the API on the same domain as the site so the browser calls /api/* (no CORS needed).
# Uncomment once the domain is on Cloudflare:
# routes = [{ pattern = "sharkdrivingschool.co.uk/api/*", zone_name = "sharkdrivingschool.co.uk" }]

[vars]
ALLOWED_ORIGINS = "http://localhost:4321,https://sharkdrivingschool.co.uk,https://www.sharkdrivingschool.co.uk"
NOTIFY_EMAIL = ""   # where booking alerts go; empty = the email on the site
FROM_EMAIL = ""     # verified sender, e.g. "Shark Driving School <bookings@sharkdrivingschool.co.uk>"
EMAIL_CUSTOMER = "true"          # also email the learner a confirmation
WHATSAPP_PROVIDER = ""           # "callmebot" or "cloud" (empty = no WhatsApp alerts)
WHATSAPP_TO = ""                 # empty = the number on the site (447440260063)
WHATSAPP_CLOUD_PHONE_NUMBER_ID = ""
WHATSAPP_CLOUD_TEMPLATE = ""     # approved template name (recommended for the Cloud API)
WHATSAPP_CLOUD_TEMPLATE_LANG = "en_GB"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   RESEND_API_KEY
#   CALLMEBOT_API_KEY      (if WHATSAPP_PROVIDER = "callmebot")
#   WHATSAPP_CLOUD_TOKEN   (if WHATSAPP_PROVIDER = "cloud")

[[d1_databases]]
binding = "DB"
database_name = "shark-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"
